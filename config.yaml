# =============================================
#  AIトレーダー 設定ファイル
#  ここを書き換えるだけで、見る銘柄やルールを変えられます。
#  「#」から右はメモ（プログラムは読みません）。
# =============================================

# ■ 銘柄の決め方
#   auto   : 毎週日曜に市場全体から自動で選んだ銘柄（docs/watchlist.yaml）を使う
#   manual : 下の watchlist に書いた銘柄を使う
watchlist_source: auto

# ■ 自分で決める銘柄（manual のとき、または自動の一覧がまだないときに使う）
watchlist:
  - code: "7203"
    name: トヨタ自動車
  - code: "6758"
    name: ソニーグループ
  - code: "8306"
    name: 三菱UFJフィナンシャル・グループ
  - code: "9432"
    name: NTT
  - code: "7974"
    name: 任天堂

# ■ 使う売買ルール（使わないものは行頭に「#」をつける）
#   golden_cross : 短い期間の平均が長い期間の平均を上に抜けたら「買い」
#   rsi          : 売られすぎ（数値が低い）で「買い」、買われすぎで「売り」
#   bollinger    : 価格が普段の値動きの幅より大きく下がったら「買い」
#   pullback     : 上昇中の銘柄が一時的に下がったところ（押し目）で「買い」
strategies:
  # - golden_cross
  # - rsi            # 2026-11-22〜11-25 に使っていたルール
  # - bollinger
  - pullback       # 2026-11-25 過去4年の比較（docs/compare.md）で採用

# ■ ルールごとの細かい数字（気軽に変えてOK）
params:
  golden_cross:
    short: 5      # 短い平均の日数
    long: 25      # 長い平均の日数
  rsi:
    period: 14    # 何日分で計算するか
    buy_below: 35 # この数値を下回ったら買いサイン
    sell_above: 75 # この数値を上回ったら売りサイン
  bollinger:
    period: 20    # 平均を取る日数
    width: 2.0    # 幅（大きいほどサインが出にくい）
  pullback:
    trend: 75       # 何日平均より上なら「上昇中」とみなすか
    period: 14      # RSIを何日分で計算するか
    buy_below: 50   # 上昇中にRSIがこれを下回ったら買いサイン
    sell_above: 75  # RSIがこれを上回ったら売りサイン

# ■ 過去データでの試運転（バックテスト）
backtest:
  years: 3        # 何年分さかのぼるか
  budget: 100000  # 1銘柄あたりに使う金額（円）。1株単位で計算します

# ■ 仮想売買（本物のお金は使いません）
#   サインどおりに売買したことにして、成績を docs/paper.json に記録します。
#   最初からやり直したいときは docs/paper.json を消します。
paper:
  capital: 1000000    # 仮想資金（円）
  max_positions: 5    # 同時に持つ銘柄数の上限（1銘柄あたり 資金÷この数 まで）
  stop_loss: 10       # 買値から何%下がったら損切りするか（0 なら使わない）
  take_profit: 0      # 何%上がったら利益確定するか（0 なら売りサインまで持つ）

# ■ LINE通知
notify:
  only_when_signal: true  # true = サインが出た日だけ通知 / false = 毎日通知

# ■ 銘柄の絞り込みとルール探し（research.py で使う）
research:
  years: 4          # 何年分のデータを使うか
  test_years: 1     # そのうち直近何年を「検証用」に取っておくか
  budget: 300000    # 1銘柄あたりの予算（円）
  cost_pct: 0.1     # 手数料・すべりの見込み（片道%）
  screen:
    min_turnover_oku: 10   # 1日の売買代金が何億円以上か（売買しやすさ）
    min_vol: 20            # 値動きの大きさ（年率%）の下限：動かない株は除く
    max_vol: 60            # 上限：荒すぎる株は除く
    max_cost_100: 300000   # 100株の金額の上限（円）：少額で買えるか
    trend_only: true       # 上昇トレンドの銘柄だけにするか
    top_n: 20              # 候補を何銘柄まで絞るか
