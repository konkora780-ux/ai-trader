# =============================================
#  AIトレーダー 設定ファイル
#  ここを書き換えるだけで、見る銘柄やルールを変えられます。
#  「#」から右はメモ（プログラムは読みません）。
# =============================================

# ■ 見たい銘柄（証券コード4桁と、自分用の名前）
watchlist:
  - code: "7203"
    name: トヨタ自動車
  - code: "6758"
    name: ソニーグループ
  - code: "8306"
    name: 三菱UFJフィナンシャル・グループ
  - code: "9432"
    name: NTT
  - code: "7974"
    name: 任天堂

# ■ 使う売買ルール（使わないものは行頭に「#」をつける）
#   golden_cross : 短い期間の平均が長い期間の平均を上に抜けたら「買い」
#   rsi          : 売られすぎ（数値が低い）で「買い」、買われすぎで「売り」
#   bollinger    : 価格が普段の値動きの幅より大きく下がったら「買い」
strategies:
  - golden_cross
  - rsi
  # - bollinger

# ■ ルールごとの細かい数字（気軽に変えてOK）
params:
  golden_cross:
    short: 5      # 短い平均の日数
    long: 25      # 長い平均の日数
  rsi:
    period: 14    # 何日分で計算するか
    buy_below: 30 # この数値を下回ったら買いサイン
    sell_above: 70 # この数値を上回ったら売りサイン
  bollinger:
    period: 20    # 平均を取る日数
    width: 2.0    # 幅（大きいほどサインが出にくい）

# ■ 過去データでの試運転（バックテスト）
backtest:
  years: 3        # 何年分さかのぼるか
  budget: 100000  # 1銘柄あたりに使う金額（円）。1株単位で計算します

# ■ LINE通知
notify:
  only_when_signal: true  # true = サインが出た日だけ通知 / false = 毎日通知
