# AI判断の試し（GitHubの画面から手動で実行。売買はしません）
name: ai-test

on:
  workflow_dispatch:
    inputs:
      code:
        description: "試したい銘柄の証券コード（4桁）"
        default: "7203"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          AI_TEST_CODE: ${{ inputs.code }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 利用料の記録を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/ai_usage.json || exit 0
          git commit -m "AI判断の試しの利用料を記録" || echo "変更なし"
          git pull --rebase
          git push
