# 買いサインが出やすいルールの比較（GitHubの画面から手動で実行）
name: compare

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["compare.py", ".github/workflows/compare.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python compare.py
      - name: 結果を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/compare.md
          git commit -m "ルール比較の結果を更新" || echo "変更なし"
          git pull --rebase
          git push
