# 平日の16:00（日本時間）に自動で分析し、LINE通知と結果画面の更新を行う
name: daily-signal

on:
  schedule:
    # GitHubの定時実行は混雑で数時間遅れることがあるため、ちょうど0分を避け、予備も入れる。
    # 同じ取引日を2回処理することはない（2回目は何もせず終わる）。
    - cron: "17 7 * * 1-5"   # 日本時間 16:17（月〜金）
    - cron: "47 9 * * 1-5"   # 予備：日本時間 18:47
    - cron: "17 12 * * 1-5"  # 予備：日本時間 21:17
  workflow_dispatch:         # GitHubの画面から手動でも実行できる
    inputs:
      always:
        description: "サインがなくてもLINEに送る（通知の試し用）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py ${{ inputs.always && '--always' || '' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      - name: 結果画面を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/index.html docs/paper.json
          git commit -m "今日のサインを更新" || echo "変更なし"
          git pull --rebase
          git push
